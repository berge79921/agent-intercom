<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <title>Agent Intercom — four agents working, messages travelling by pneumatic tube</title>
  <defs>
    <path id="tube_lb" d="M 330 128 H 570"/>
    <path id="tube_bv" d="M 660 196 V 292"/>
    <path id="tube_vl" d="M 570 330 H 330"/>
    <path id="tube_lh" d="M 240 196 V 292"/>
    <path id="tube_wake" d="M 300 356 H 600"/>
    <g id="capsule">
      <rect x="-11" y="-7" width="22" height="14" rx="7" fill="#e8b64c" stroke="#8a6b1e" stroke-width="1.1"/>
      <line x1="-4" y1="-7" x2="-4" y2="7" stroke="#8a6b1e" stroke-width=".8" opacity=".7"/>
      <line x1="4" y1="-7" x2="4" y2="7" stroke="#8a6b1e" stroke-width=".8" opacity=".7"/>
    </g>
    <g id="capsule_ok">
      <rect x="-11" y="-7" width="22" height="14" rx="7" fill="#4c9f6a" stroke="#2c6b45" stroke-width="1.1"/>
      <path d="M -4 0 L -1 3 L 5 -3" fill="none" stroke="#e8f5ec" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <g id="capsule_wake">
      <rect x="-12" y="-8" width="24" height="16" rx="8" fill="#d1584c" stroke="#8f3129" stroke-width="1.1"/>
      <path d="M 0 -4 V 1 M 0 3.5 V 4.5" stroke="#fff0ee" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </defs>

  <style>
    .desk   { fill:#8892a0; fill-opacity:.07; stroke:#8892a0; stroke-width:1.2 }
    .name   { fill:#9aa4b2; font-size:12.5px; letter-spacing:.1em }
    .role   { fill:#7c8894; font-size:9px; letter-spacing:.05em }
    .screen { fill:#0f1620; stroke:#5b6675; stroke-width:1 }
    .tube   { stroke:#8892a0; stroke-width:11; fill:none; stroke-linecap:round; opacity:.16 }
    .tubein { stroke:#8892a0; stroke-width:7; fill:none; stroke-linecap:round; opacity:.10 }
    .hint   { stroke:#8892a0; stroke-width:1.3; stroke-dasharray:1 9; fill:none; opacity:.45 }
    .lbl    { fill:#7c8894; font-size:9px; letter-spacing:.06em }
    .cap    { fill:#8892a0; font-size:10px; letter-spacing:.04em }
    .code   { fill:#5b8fb9 }
    .codeok { fill:#4c9f6a }
    .codewarn { fill:#e8b64c }

    @keyframes flow { to { stroke-dashoffset:-20 } }
    .hint { animation: flow 1.3s linear infinite }
    @keyframes beat { 0%,100% { r:3; opacity:.95 } 50% { r:5.5; opacity:.3 } }
    .hb { fill:#4c9f6a; animation: beat 2.6s ease-in-out infinite }
    @keyframes type { 0% { width:0 } 60% { width:var(--w) } 100% { width:var(--w) } }
    .ln { animation: type 2.8s steps(12) infinite }
    @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
    .cur { fill:#9aa4b2; animation: blink 1.1s step-end infinite }
    @keyframes progress { 0% { width:2px } 70% { width:46px } 100% { width:46px } }
    .bar { fill:#5b8fb9; animation: progress 4.2s ease-out infinite }
    @keyframes scan { 0%,100% { transform:translateX(0) } 50% { transform:translateX(26px) } }
    .lens { animation: scan 3.4s ease-in-out infinite }
    @keyframes stamp { 0%,70% { transform:translateY(-9px); opacity:.35 } 78%,88% { transform:translateY(0); opacity:1 } 100% { transform:translateY(-9px); opacity:.35 } }
    .stamp { animation: stamp 5.2s ease-in-out infinite }
    @keyframes pass { 0%,45% { opacity:0 } 55%,100% { opacity:1 } }
    .verdict { animation: pass 3.4s ease-in-out infinite }
  </style>

  <!-- tubes -->
  <use href="#tube_lb" class="tube"/><use href="#tube_lb" class="tubein"/><use href="#tube_lb" class="hint"/>
  <use href="#tube_bv" class="tube"/><use href="#tube_bv" class="tubein"/><use href="#tube_bv" class="hint" style="animation-delay:-.4s"/>
  <use href="#tube_vl" class="tube"/><use href="#tube_vl" class="tubein"/><use href="#tube_vl" class="hint" style="animation-delay:-.8s"/>
  <use href="#tube_lh" class="tube"/><use href="#tube_lh" class="tubein"/><use href="#tube_lh" class="hint" style="animation-delay:-.2s"/>

  <!-- LEAD: desk with inbox, assigning -->
  <g>
    <rect class="desk" x="120" y="76" width="210" height="104" rx="7"/>
    <text class="name" x="136" y="98">LEAD</text><text class="role" x="136" y="112">assign · gate · merge</text>
    <rect class="screen" x="136" y="120" width="104" height="48" rx="3"/>
    <rect class="ln code" x="142" y="128" height="3.5" style="--w:62px"/>
    <rect class="ln codewarn" x="142" y="136" height="3.5" style="--w:44px; animation-delay:-.9s"/>
    <rect class="ln code" x="142" y="144" height="3.5" style="--w:74px; animation-delay:-1.7s"/>
    <rect class="cur" x="142" y="152" width="5" height="4"/>
    <g transform="translate(258,124)">
      <rect x="0" y="6" width="52" height="30" rx="2" fill="none" stroke="#7c8894" stroke-width="1.1"/>
      <path d="M 0 12 H 52 M 0 20 H 52 M 0 28 H 52" stroke="#7c8894" stroke-width=".8" opacity=".55"/>
      <rect class="stamp" x="14" y="-2" width="24" height="9" rx="1.5" fill="#8892a0" opacity=".5"/>
    </g>
    <circle class="hb" cx="316" cy="90" r="3"/>
  </g>

  <!-- BUILDER: terminal running tests + workpiece -->
  <g>
    <rect class="desk" x="570" y="76" width="210" height="104" rx="7"/>
    <text class="name" x="586" y="98">BUILDER</text><text class="role" x="586" y="112">implement · test · push</text>
    <rect class="screen" x="586" y="120" width="112" height="48" rx="3"/>
    <rect class="ln codeok" x="592" y="127" height="3.5" style="--w:80px"/>
    <rect class="ln code" x="592" y="134" height="3.5" style="--w:56px; animation-delay:-.6s"/>
    <rect class="ln code" x="592" y="141" height="3.5" style="--w:92px; animation-delay:-1.2s"/>
    <rect class="ln codeok" x="592" y="148" height="3.5" style="--w:38px; animation-delay:-1.9s"/>
    <rect class="cur" x="592" y="156" width="5" height="4"/>
    <rect x="712" y="150" width="52" height="5" rx="2.5" fill="#8892a0" opacity=".22"/>
    <rect class="bar" x="712" y="150" width="2" height="5" rx="2.5"/>
    <text class="role" x="712" y="144" opacity=".8">npm test</text>
    <circle class="hb" cx="766" cy="90" r="3" style="animation-delay:-.9s"/>
  </g>

  <!-- VERIFIER: own clone, lens scanning, verdict -->
  <g>
    <rect class="desk" x="570" y="292" width="210" height="104" rx="7"/>
    <text class="name" x="586" y="314">VERIFIER</text><text class="role" x="586" y="328">own clone · mutants · verdict</text>
    <rect class="screen" x="586" y="336" width="112" height="48" rx="3"/>
    <rect x="592" y="344" width="88" height="3.5" fill="#5b8fb9" opacity=".55"/>
    <rect x="592" y="352" width="64" height="3.5" fill="#5b8fb9" opacity=".55"/>
    <rect x="592" y="360" width="96" height="3.5" fill="#5b8fb9" opacity=".55"/>
    <rect x="592" y="368" width="52" height="3.5" fill="#5b8fb9" opacity=".55"/>
    <g class="lens"><circle cx="606" cy="356" r="13" fill="#cfe3f2" fill-opacity=".14" stroke="#9aa4b2" stroke-width="1.4"/>
      <line x1="615" y1="365" x2="622" y2="372" stroke="#9aa4b2" stroke-width="2" stroke-linecap="round"/></g>
    <g transform="translate(712,344)">
      <circle class="verdict" cx="4" cy="4" r="3.5" fill="#4c9f6a"/>
      <circle class="verdict" cx="16" cy="4" r="3.5" fill="#4c9f6a" style="animation-delay:-.5s"/>
      <circle class="verdict" cx="28" cy="4" r="3.5" fill="#d1584c" style="animation-delay:-1s"/>
      <circle class="verdict" cx="4" cy="16" r="3.5" fill="#4c9f6a" style="animation-delay:-1.5s"/>
      <circle class="verdict" cx="16" cy="16" r="3.5" fill="#4c9f6a" style="animation-delay:-2s"/>
      <circle class="verdict" cx="28" cy="16" r="3.5" fill="#4c9f6a" style="animation-delay:-2.5s"/>
      <text class="role" x="0" y="34" opacity=".8">mutants</text>
    </g>
    <circle class="hb" cx="766" cy="306" r="3" style="animation-delay:-1.7s"/>
  </g>

  <!-- HUMAN: decides, coffee, approval -->
  <g>
    <rect class="desk" x="120" y="292" width="210" height="104" rx="7"/>
    <text class="name" x="136" y="314">HUMAN</text><text class="role" x="136" y="328">decides what agents may not</text>
    <g transform="translate(140,340)">
      <rect x="0" y="4" width="46" height="34" rx="2" fill="none" stroke="#7c8894" stroke-width="1.1"/>
      <path d="M 6 14 H 40 M 6 22 H 34 M 6 30 H 40" stroke="#7c8894" stroke-width=".9" opacity=".5"/>
      <g class="stamp" style="animation-delay:-2.6s"><rect x="10" y="-4" width="26" height="10" rx="1.5" fill="#4c9f6a" opacity=".65"/></g>
    </g>
    <g transform="translate(212,348)" opacity=".8">
      <path d="M 0 6 H 20 V 18 A 6 6 0 0 1 14 24 H 6 A 6 6 0 0 1 0 18 Z" fill="none" stroke="#7c8894" stroke-width="1.2"/>
      <path d="M 20 9 H 25 A 4 4 0 0 1 25 17 H 20" fill="none" stroke="#7c8894" stroke-width="1.2"/>
      <path d="M 5 0 c 0 3 3 3 3 6 M 12 0 c 0 3 3 3 3 6" fill="none" stroke="#7c8894" stroke-width="1" opacity=".55"/>
    </g>
    <circle class="hb" cx="316" cy="306" r="3" style="animation-delay:-2.1s"/>
  </g>

  <!-- capsules in the tubes -->
  <g><use href="#capsule"/><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#tube_lb"/></animateMotion></g>
  <g><use href="#capsule"/><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite"><mpath href="#tube_lb"/></animateMotion></g>
  <g><use href="#capsule"/><animateMotion dur="2.8s" begin="3.6s" repeatCount="indefinite"><mpath href="#tube_bv"/></animateMotion></g>
  <g><use href="#capsule_ok"/><animateMotion dur="3.4s" begin="5s" repeatCount="indefinite"><mpath href="#tube_vl"/></animateMotion></g>
  <g><use href="#capsule"/><animateMotion dur="3s" begin="6.6s" repeatCount="indefinite"><mpath href="#tube_lh"/></animateMotion></g>

  <!-- watchdog wake-up: rare, deliberate -->
  <g opacity="0">
    <use href="#capsule_wake"/>
    <animateMotion dur="2.4s" begin="9s;21s;33s"><mpath href="#tube_wake"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.92;1" dur="2.4s" begin="9s;21s;33s"/>
  </g>

  <text class="lbl" x="392" y="118">task ▸</text>
  <text class="lbl" x="672" y="248">handoff ▾</text>
  <text class="lbl" x="418" y="320">◂ gate · ack</text>
  <text class="lbl" x="252" y="248">escalation ▾</text>
  <text class="lbl" x="376" y="380" opacity=".8">◂ watchdog wake-up: nobody has heard from that agent</text>

  <text class="cap" x="120" y="42">Four agents, one git branch. Every capsule is a commit you can read back.</text>
  <text class="cap" x="120" y="58" opacity=".72">green pulse = heartbeat “I am alive and working” · red capsule = a quiet agent being woken · tubes never carry secrets</text>
</svg>
